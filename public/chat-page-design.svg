<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>AIT chat page design mockup</title>
  <desc>Dark chat page layout with header, sidebar, branch graph, messages, and docked input.</desc>

  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="72" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="avatarGradient" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .bg { fill: #020617; }
      .panel { fill: #0f172a; }
      .panel-2 { fill: #1e293b; }
      .line { stroke: #1e293b; }
      .line-soft { stroke: #334155; }
      .text-main { fill: #f8fafc; font-family: "Segoe UI", "Noto Sans KR", sans-serif; }
      .text-muted { fill: #64748b; font-family: "Segoe UI", "Noto Sans KR", sans-serif; }
      .text-soft { fill: #cbd5e1; font-family: "Segoe UI", "Noto Sans KR", sans-serif; }
      .label { fill: #64748b; font-family: "Segoe UI", "Noto Sans KR", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
      .small { font-size: 11px; }
      .body { font-size: 14px; }
      .title { font-size: 20px; font-weight: 900; }
      .semibold { font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>

  <!-- Header -->
  <rect class="panel" x="0" y="0" width="1440" height="56"/>
  <line class="line" x1="0" y1="55.5" x2="1440" y2="55.5"/>
  <rect x="20" y="12" width="32" height="32" rx="10" fill="#0f172a"/>
  <line x1="29" y1="23" x2="43" y2="23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="28" x2="43" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="33" x2="43" y2="33" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <text class="text-main title" x="66" y="35">
    <tspan fill="url(#brandGradient)">A</tspan><tspan>IT</tspan>
  </text>
  <text class="text-muted body" x="112" y="34">분기 그래프 기반 대화형 AI 에이전트</text>
  <rect x="1304" y="17" width="52" height="24" rx="8" fill="#334155" fill-opacity="0.45" stroke="#334155"/>
  <text class="text-soft small semibold" x="1316" y="33">FREE</text>
  <rect x="1372" y="14" width="28" height="28" rx="10" fill="url(#avatarGradient)"/>
  <text class="text-main small semibold" x="1382" y="32" fill="#020617">J</text>

  <!-- Sidebar -->
  <rect class="panel" x="0" y="56" width="300" height="844"/>
  <line class="line" x1="299.5" y1="56" x2="299.5" y2="900"/>

  <rect x="12" y="68" width="276" height="44" rx="12" fill="#22d3ee"/>
  <text x="103" y="96" fill="#020617" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="14" font-weight="800">+ 새 채팅</text>

  <text class="label" x="20" y="140">최근 대화</text>

  <rect x="12" y="151" width="276" height="58" rx="12" fill="#22d3ee" fill-opacity="0.10" stroke="#67e8f9" stroke-opacity="0.25"/>
  <text class="text-soft body semibold" x="26" y="175">프론트엔드 에러 처리 전략</text>
  <text class="text-muted small" x="26" y="194">API 실패, 빈 상태, 재시도...</text>
  <text class="text-muted body" x="270" y="183">▾</text>

  <line x1="32" y1="218" x2="32" y2="319" stroke="#334155" stroke-opacity="0.6"/>
  <rect x="42" y="218" width="236" height="28" rx="8" fill="#1e293b" fill-opacity="0.45"/>
  <text class="text-muted small" x="62" y="236">API 실패 UX</text>
  <text class="text-muted small" x="256" y="236">T1</text>
  <rect x="42" y="250" width="236" height="28" rx="8" fill="#f59e0b" fill-opacity="0.12"/>
  <text x="62" y="268" fill="#fcd34d" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="11">폼 검증 케이스</text>
  <text class="text-muted small" x="256" y="268">T4</text>
  <rect x="42" y="282" width="236" height="28" rx="8" fill="#1e293b" fill-opacity="0.45"/>
  <text class="text-muted small" x="62" y="300">접근성 점검</text>
  <text class="text-muted small" x="256" y="300">T5</text>

  <rect x="12" y="329" width="276" height="58" rx="12" fill="#0f172a"/>
  <text class="text-soft body semibold" x="26" y="353">소프트웨어 공학 SRS</text>
  <text class="text-muted small" x="26" y="372">기능 요구사항과 비기능...</text>
  <text class="text-muted body" x="270" y="361">▸</text>

  <rect x="12" y="393" width="276" height="58" rx="12" fill="#0f172a"/>
  <text class="text-soft body semibold" x="26" y="417">React 최적화 기법</text>
  <text class="text-muted small" x="26" y="436">useMemo와 useCallback...</text>
  <text class="text-muted body" x="270" y="425">▸</text>

  <rect x="12" y="457" width="276" height="58" rx="12" fill="#0f172a"/>
  <text class="text-soft body semibold" x="26" y="481">짧은 QA: 배포 환경 변수</text>
  <text class="text-muted small" x="26" y="500">Vite 환경 변수 이름 규칙...</text>

  <line class="line" x1="0" y1="536" x2="300" y2="536"/>
  <text class="label" x="20" y="567">분기 구조</text>

  <!-- Branch graph -->
  <g transform="translate(28 594)">
    <line x1="28" y1="20" x2="28" y2="260" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="20" x2="124" y2="63" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="200" x2="204" y2="243" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="260" x2="252" y2="303" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="124" y1="63" x2="124" y2="123" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <line x1="124" y1="123" x2="124" y2="183" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>

    <rect x="2" y="6" width="52" height="28" rx="10" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <text x="28" y="24" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">root</text>
    <rect x="11" y="66" width="34" height="28" rx="10" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <text x="28" y="84" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">T2</text>
    <rect x="11" y="126" width="34" height="28" rx="10" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <text x="28" y="144" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">T3</text>
    <rect x="11" y="186" width="34" height="28" rx="10" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <text x="28" y="204" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">T4</text>
    <rect x="11" y="246" width="34" height="28" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="28" y="264" fill="#94a3b8" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">T5</text>

    <rect x="100" y="49" width="48" height="28" rx="10" fill="#d97706" stroke="#f59e0b" stroke-width="2"/>
    <text x="124" y="67" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">B1</text>
    <rect x="95" y="109" width="58" height="28" rx="10" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <text x="124" y="127" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">B1-T1</text>
    <rect x="95" y="169" width="58" height="28" rx="10" fill="#0f766e" stroke="#2dd4bf" stroke-width="2"/>
    <text x="124" y="187" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">B1-T2</text>
    <rect x="180" y="229" width="48" height="28" rx="10" fill="#d97706" stroke="#f59e0b" stroke-width="2"/>
    <text x="204" y="247" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">B2</text>
  </g>

  <g transform="translate(20 840)">
    <circle cx="5" cy="5" r="5" fill="#be123c" stroke="#fb7185"/>
    <text class="text-muted small" x="18" y="9">선택한 노드</text>
    <circle cx="5" cy="25" r="5" fill="#0f766e" stroke="#2dd4bf"/>
    <text class="text-muted small" x="18" y="29">선택한 흐름</text>
  </g>

  <!-- Chat content -->
  <rect class="bg" x="300" y="56" width="1140" height="844"/>

  <g transform="translate(348 96)">
    <rect width="28" height="28" rx="9" fill="#0e7490"/>
    <text x="10" y="19" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="12" font-weight="800">A</text>
    <rect x="40" y="0" width="520" height="104" rx="18" fill="#1e293b"/>
    <rect x="40" y="0" width="20" height="20" rx="4" fill="#1e293b"/>
    <text class="text-soft body" x="60" y="28">API 실패 화면은 보통 세 단계로 나누면 좋습니다.</text>
    <text class="text-soft body" x="60" y="56">1. 즉시 피드백: 실패 상태를 명확히 표시</text>
    <text class="text-soft body" x="60" y="80">2. 회복 행동: 다시 시도 버튼과 이동 경로 제공</text>
    <text class="text-muted small" x="48" y="132">▣ 복사</text>
    <text fill="#f59e0b" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="11" x="104" y="132">⌁ 분기</text>
  </g>

  <g transform="translate(1028 238)">
    <rect width="28" height="28" rx="9" fill="url(#avatarGradient)"/>
    <text x="10" y="19" fill="#020617" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="12" font-weight="800">J</text>
    <rect x="-520" y="0" width="500" height="56" rx="18" fill="#0e7490"/>
    <rect x="-40" y="0" width="20" height="20" rx="4" fill="#0e7490"/>
    <text class="text-main body" x="-496" y="34">데이터가 아예 없을 때 empty state는 어떻게 써야 자연스러워?</text>
  </g>

  <g transform="translate(348 334)">
    <rect width="28" height="28" rx="9" fill="#0e7490"/>
    <text x="10" y="19" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="12" font-weight="800">A</text>
    <rect x="40" y="0" width="610" height="126" rx="18" fill="#1e293b"/>
    <rect x="40" y="0" width="20" height="20" rx="4" fill="#1e293b"/>
    <text class="text-soft body" x="60" y="29">빈 상태는 문제 없음과 다음 행동을 같이 알려줘야 합니다.</text>
    <text class="text-soft body" x="60" y="59">- 첫 사용자: 아직 대화가 없습니다 + 새 채팅 버튼</text>
    <text class="text-soft body" x="60" y="85">- 검색 결과 없음: 검색어 수정 제안</text>
    <text class="text-soft body" x="60" y="111">- 필터 결과 없음: 필터 초기화 버튼</text>
  </g>

  <g transform="translate(348 498)">
    <line x1="0" y1="16" x2="450" y2="16" stroke="#f59e0b" stroke-opacity="0.5" stroke-dasharray="6 6"/>
    <rect x="470" y="0" width="42" height="32" rx="16" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="483" y="21" fill="#fcd34d" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="11" font-weight="800">B2</text>
    <line x1="532" y1="16" x2="984" y2="16" stroke="#f59e0b" stroke-opacity="0.5" stroke-dasharray="6 6"/>
  </g>

  <g transform="translate(348 560)">
    <rect width="28" height="28" rx="9" fill="#0e7490"/>
    <text x="10" y="19" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="12" font-weight="800">A</text>
    <rect x="40" y="0" width="520" height="80" rx="18" fill="#1e293b"/>
    <rect x="40" y="0" width="20" height="20" rx="4" fill="#1e293b"/>
    <text class="text-soft body" x="60" y="30">폼 검증 케이스 브랜치입니다.</text>
    <text class="text-soft body" x="60" y="58">제출 전/후 검증 흐름을 테스트 데이터처럼 쪼개서 봅니다.</text>
  </g>

  <g transform="translate(1028 674)">
    <rect width="28" height="28" rx="9" fill="url(#avatarGradient)"/>
    <text x="10" y="19" fill="#020617" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="12" font-weight="800">J</text>
    <rect x="-446" y="0" width="426" height="56" rx="18" fill="#0e7490"/>
    <rect x="-40" y="0" width="20" height="20" rx="4" fill="#0e7490"/>
    <text class="text-main body" x="-422" y="34">회원가입 폼 기준으로 필수 테스트 케이스를 만들어줘.</text>
  </g>

  <!-- Docked input -->
  <rect x="300" y="812" width="1140" height="88" fill="#020617"/>
  <line class="line" x1="300" y1="812.5" x2="1440" y2="812.5"/>
  <rect x="348" y="828" width="944" height="48" rx="12" fill="#1e293b" stroke="#334155"/>
  <text class="text-muted body" x="366" y="858">무엇이든 물어보세요</text>
  <rect x="1308" y="828" width="48" height="48" rx="14" fill="#22d3ee"/>
  <path d="M1332 864L1345 836L1319 849L1332 852V864Z" stroke="#020617" stroke-width="2" stroke-linejoin="round"/>
  <text class="text-muted small" x="745" y="893" text-anchor="middle">AIT는 현재 백엔드 연결을 준비 중입니다.</text>
</svg>
