<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>AIT login page design mockup</title>
  <desc>Dark login page layout with a brand feature panel and social login actions.</desc>

  <defs>
    <linearGradient id="brandGradient" x1="96" y1="0" x2="188" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <filter id="buttonShadow" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <style>
      .bg { fill: #020617; }
      .panel-line { stroke: #1e293b; stroke-opacity: 0.6; }
      .text-main { fill: #f8fafc; font-family: "Segoe UI", "Noto Sans KR", sans-serif; }
      .text-soft { fill: #cbd5e1; font-family: "Segoe UI", "Noto Sans KR", sans-serif; }
      .text-muted { fill: #64748b; font-family: "Segoe UI", "Noto Sans KR", sans-serif; }
      .text-dim { fill: #334155; font-family: "Segoe UI", "Noto Sans KR", sans-serif; }
      .brand { font-size: 44px; font-weight: 900; letter-spacing: 0; }
      .h2 { font-size: 28px; font-weight: 800; letter-spacing: 0; }
      .quote { font-size: 24px; font-weight: 300; letter-spacing: 0; }
      .body { font-size: 14px; letter-spacing: 0; }
      .small { font-size: 12px; letter-spacing: 0; }
      .button { font-size: 14px; font-weight: 700; letter-spacing: 0; }
      .feature-title { font-size: 14px; font-weight: 700; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>

  <!-- Left brand panel -->
  <rect x="0" y="0" width="720" height="900" fill="#020617"/>
  <line class="panel-line" x1="719.5" y1="0" x2="719.5" y2="900"/>

  <circle cx="558" cy="202" r="190" fill="url(#tealGlow)"/>
  <circle cx="146" cy="724" r="146" fill="url(#tealGlow)" opacity="0.45"/>

  <g transform="translate(96 76)">
    <text class="text-main brand" x="0" y="43">
      <tspan fill="#67e8f9">A</tspan><tspan>IT</tspan>
    </text>
    <text class="text-muted body" x="0" y="72">분기 그래프 기반 대화형 AI 에이전트</text>
  </g>

  <!-- Decorative branch graph motif -->
  <g transform="translate(92 210)" opacity="0.85">
    <line x1="40" y1="20" x2="40" y2="180" stroke="#1e293b" stroke-width="2"/>
    <line x1="40" y1="74" x2="148" y2="112" stroke="#334155" stroke-width="2"/>
    <line x1="40" y1="126" x2="220" y2="178" stroke="#334155" stroke-width="2"/>
    <line x1="148" y1="112" x2="148" y2="170" stroke="#0f766e" stroke-width="3"/>
    <rect x="18" y="6" width="44" height="28" rx="10" fill="#475569" stroke="#64748b"/>
    <text x="40" y="24" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">root</text>
    <rect x="23" y="60" width="34" height="28" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="78" fill="#94a3b8" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">T2</text>
    <rect x="23" y="112" width="34" height="28" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="130" fill="#94a3b8" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">T3</text>
    <rect x="120" y="98" width="56" height="28" rx="10" fill="#d97706" stroke="#f59e0b"/>
    <text x="148" y="116" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">B1</text>
    <rect x="119" y="156" width="58" height="28" rx="10" fill="#0f766e" stroke="#2dd4bf"/>
    <text x="148" y="174" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">B1-T1</text>
    <rect x="196" y="164" width="48" height="28" rx="10" fill="#d97706" stroke="#f59e0b"/>
    <text x="220" y="182" fill="#ffffff" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="9" font-weight="700" text-anchor="middle">B2</text>
  </g>

  <g transform="translate(96 548)">
    <text class="text-soft quote" x="0" y="0">
      <tspan x="0" dy="0">"대화의 흐름을 잃지 않고,</tspan>
      <tspan x="0" dy="34">원하는 지점에서 언제든</tspan>
      <tspan x="0" dy="34">새로운 분기를 시작하세요."</tspan>
    </text>

    <g transform="translate(0 130)">
      <text x="0" y="0" fill="#67e8f9" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="19">◎</text>
      <text class="text-soft feature-title" x="32" y="-2">분기 관리</text>
      <text class="text-muted small" x="32" y="18">대화 흐름을 DAG 구조로 관리</text>
    </g>

    <g transform="translate(0 182)">
      <text x="0" y="0" fill="#67e8f9" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="19">◇</text>
      <text class="text-soft feature-title" x="32" y="-2">그래프 시각화</text>
      <text class="text-muted small" x="32" y="18">분기 구조를 한눈에 파악</text>
    </g>

    <g transform="translate(0 234)">
      <text x="0" y="0" fill="#67e8f9" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="19">△</text>
      <text class="text-soft feature-title" x="32" y="-2">맥락 보존</text>
      <text class="text-muted small" x="32" y="18">분기별 독립적인 컨텍스트 유지</text>
    </g>
  </g>

  <text class="text-dim small" x="96" y="832">© 2026 AIT. All rights reserved.</text>

  <!-- Right login panel -->
  <rect x="720" y="0" width="720" height="900" fill="#020617"/>

  <g transform="translate(890 268)">
    <text class="text-main h2" x="0" y="0">시작하기</text>
    <text class="text-muted body" x="0" y="28">계정으로 계속하세요</text>

    <!-- Google button -->
    <rect x="0" y="70" width="392" height="52" rx="16" fill="#ffffff" filter="url(#buttonShadow)"/>
    <g transform="translate(116 86)">
      <path d="M19.64 10.2c0-.62-.06-1.22-.16-1.8H11.2v3.41h4.74c-.21 1.1-.83 2.02-1.77 2.65v2.22h2.86c1.67-1.54 2.61-3.79 2.61-6.48z" fill="#4285F4"/>
      <path d="M11.2 19c2.38 0 4.37-.79 5.83-2.32l-2.86-2.22c-.78.53-1.78.85-2.97.85-2.29 0-4.23-1.54-4.93-3.62H3.35v2.27C4.79 16.83 7.76 19 11.2 19z" fill="#34A853"/>
      <path d="M6.27 11.69c-.18-.53-.28-1.09-.28-1.69s.1-1.14.28-1.67V6.05H3.35C2.74 7.24 2.4 8.58 2.4 10s.34 2.76.95 3.96l2.28-1.78.64-.49z" fill="#FBBC05"/>
      <path d="M11.2 4.7c1.3 0 2.45.45 3.37 1.31l2.52-2.52C15.57 2.07 13.58 1.2 11.2 1.2c-3.44 0-6.41 2.17-7.85 5.75l2.92 2.28c.7-2.09 2.64-4.53 4.93-4.53z" fill="#EA4335"/>
    </g>
    <text x="161" y="101" fill="#1f2937" font-family="Segoe UI, Noto Sans KR, sans-serif" font-size="14" font-weight="700">Google로 계속하기</text>

    <!-- GitHub button -->
    <rect x="0" y="134" width="392" height="52" rx="16" fill="#1e293b" stroke="#334155"/>
    <path d="M126 149.2c-5.1 0-9.2 4.13-9.2 9.2 0 4.06 2.63 7.51 6.29 8.72.46.09.61-.2.61-.44v-1.71c-2.56.56-3.09-1.09-3.09-1.09-.42-1.06-1.02-1.34-1.02-1.34-.84-.57.06-.56.06-.56.93.06 1.41.95 1.41.95.82 1.41 2.15 1 2.68.77.08-.6.32-1 .58-1.23-2.04-.24-4.19-1.02-4.19-4.55 0-1 .36-1.82.95-2.47-.1-.23-.41-1.17.09-2.43 0 0 .77-.25 2.53.94.74-.2 1.52-.31 2.3-.31.78 0 1.57.11 2.31.31 1.75-1.19 2.53-.94 2.53-.94.5 1.27.18 2.2.09 2.43.59.65.95 1.47.95 2.47 0 3.54-2.15 4.31-4.2 4.54.33.29.63.85.63 1.71v2.53c0 .25.15.53.61.44 3.65-1.22 6.28-4.66 6.28-8.72 0-5.07-4.1-9.2-9.2-9.2z" fill="#ffffff"/>
    <text class="text-main button" x="161" y="166">GitHub로 계속하기</text>

    <!-- Divider -->
    <line x1="0" y1="220" x2="175" y2="220" stroke="#1e293b"/>
    <rect x="175" y="208" width="42" height="24" fill="#020617"/>
    <text class="text-muted small" x="185" y="224">또는</text>
    <line x1="217" y1="220" x2="392" y2="220" stroke="#1e293b"/>

    <!-- Email button -->
    <rect x="0" y="254" width="392" height="52" rx="16" fill="#020617" stroke="#334155"/>
    <text class="text-soft button" x="143" y="286">이메일로 계속하기</text>

    <text class="text-dim small" x="48" y="352">
      <tspan>계속 진행하면 </tspan>
      <tspan fill="#64748b" text-decoration="underline">이용약관</tspan>
      <tspan> 및 </tspan>
      <tspan fill="#64748b" text-decoration="underline">개인정보 처리방침</tspan>
      <tspan>에 동의합니다.</tspan>
    </text>
  </g>
</svg>
